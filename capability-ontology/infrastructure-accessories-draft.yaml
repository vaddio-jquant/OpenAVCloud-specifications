openapi: 3.1.0
info:
  title: OpenAV Infrastructure & Accessories Capability Draft
  version: 0.1.0
  description: Discussion draft for Infrastructure & Accessories capabilities. This document proposes
    capability names, properties, operations, and events; implementations expose only the capabilities
    and operations they support. WebSocket event messages are described in the companion
    infrastructure-accessories-events-draft.yaml. WebSocket connection, authentication, transport-ID
    creation, and delivery lifecycle details are pending. Device-common APIs are outside this
    category-specific draft and are expected to be defined separately.
servers:
- url: https://api.example.com
  description: Draft server
security:
- OAuth2ClientCredentials: []
tags:
- name: Devices
  description: 'Retrieve the capabilities of a device. Layer: Device common (proposed for all categories).'
- name: OutletPower
  description: Monitor and control power for individual outlets and subscribe to outlet power events.
- name: PoePower
  description: Monitor and control power for individual Power over Ethernet ports and subscribe to port power events.
- name: Networking
  description: Get network interface and port information.
- name: Connectivity
  description: Get physical connection information and subscribe to connection events.
- name: Mounting
  description: Get mounting information for a device.
- name: RackEnclosure
  description: Get rack or enclosure information and subscribe to lock-state events.
- name: EnvironmentalMonitoring
  description: Get environmental readings and subscribe to environmental events.
paths:
  /v1/devices/{deviceId}/capabilities:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    get:
      operationId: deviceCapabilities
      summary: Get device capabilities
      description: Returns the capabilities supported by the device and the operationIds associated with
        each capability.
      tags:
      - Devices
      responses:
        '200':
          description: The device capabilities were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCapabilities'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/outlets:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/first'
    - $ref: '#/components/parameters/after'
    get:
      operationId: listOutletPower
      summary: List outlet power information
      description: Returns a page of outlets accessible to the caller and the total count across all pages.
      tags:
      - OutletPower
      responses:
        '200':
          description: The outlet page was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletPowerPage'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/outlets/{outletNumber}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/outletNumber'
    get:
      operationId: outletPower
      summary: Get outlet power status
      tags:
      - OutletPower
      responses:
        '200':
          description: Outlet power status was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutletPower'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
    patch:
      operationId: updateOutletPower
      summary: Update outlet power state
      tags:
      - OutletPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerStateRequest'
      responses:
        '204':
          description: Outlet power state updated successfully.
        '202':
          description: The request was accepted but may not yet be complete. Confirm the result by reading the state or receiving an event.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '409':
          $ref: '#/components/responses/DeviceBusyResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/outlets/{outletNumber}/cycle:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/outletNumber'
    post:
      operationId: cycleOutletPower
      summary: Cycle outlet power
      description: Interrupts power to an on outlet for the requested duration, then restores it. Rejects
        an already-off outlet. Repeating this request may cause another interruption.
      tags:
      - OutletPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerCycleRequest'
      responses:
        '202':
          description: The cycle request was accepted but may not yet be complete.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '409':
          description: The outlet is already off, or the device cannot accept the request in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/outlet-events/subscription/{transportId}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/transportId'
    post:
      operationId: subscribeOutletPower
      summary: Subscribe to outlet power events
      description: Subscribe to WebSocket power events for the device's outlets as described in the companion
        AsyncAPI draft. How the transportId is obtained is pending.
      tags:
      - OutletPower
      responses:
        '201':
          description: Subscription created successfully.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
    delete:
      operationId: unsubscribeOutletPower
      summary: Unsubscribe from outlet power events
      tags:
      - OutletPower
      responses:
        '204':
          description: Subscription deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/poe-ports:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/first'
    - $ref: '#/components/parameters/after'
