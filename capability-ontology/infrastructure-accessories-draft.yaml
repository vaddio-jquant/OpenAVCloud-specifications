      operationId: listPoePower
      summary: List PoE port power information
      description: Returns a page of PoE ports accessible to the caller and the total count across all pages.
      tags:
      - PoePower
      responses:
        '200':
          description: The PoE port page was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoePowerPage'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
