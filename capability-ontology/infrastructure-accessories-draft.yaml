  /v1/devices/{deviceId}/physical-connections:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/first'
    - $ref: '#/components/parameters/after'
    get:
      operationId: physicalConnections
      summary: List physical connections
      description: Returns a page of known physical connections accessible to the caller and the total count
        across all pages. Connection state is included only when actively monitored.
      tags:
      - Connectivity
      responses:
        '200':
          description: Physical connections were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalConnectionPage'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/physical-connections/subscription/{transportId}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/transportId'
    post:
      operationId: subscribePhysicalConnections
      summary: Subscribe to physical connection events
      description: Subscribe to WebSocket physical connection events described in the companion AsyncAPI draft.
        How the transportId is obtained is pending.
      tags:
      - Connectivity
      responses:
        '201':
          description: Subscription created successfully.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
    delete:
      operationId: unsubscribePhysicalConnections
      summary: Unsubscribe from physical connection events
      tags:
      - Connectivity
      responses:
        '204':
          description: Subscription deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
