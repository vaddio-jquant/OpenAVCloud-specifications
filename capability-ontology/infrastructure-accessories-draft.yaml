          description: PoE port power status was returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoePower'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
    patch:
      operationId: updatePoePower
      summary: Update PoE port power state
      tags:
      - PoePower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerStateRequest'
      responses:
        '204':
          description: PoE port power state updated successfully.
        '202':
          description: The request was accepted but may not yet be complete. Confirm the result by reading the state or receiving an event.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '409':
          $ref: '#/components/responses/DeviceBusyResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/poe-ports/{portNumber}/cycle:
    parameters:
    - $ref: '#/components/parameters/deviceId'
    - $ref: '#/components/parameters/portNumber'
    post:
      operationId: cyclePoePower
      summary: Cycle PoE port power
      description: Interrupts power to an on PoE port for the requested duration, then restores it. Rejects
