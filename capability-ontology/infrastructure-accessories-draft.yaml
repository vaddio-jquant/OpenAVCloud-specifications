      responses:
        '202':
          description: The cycle request was accepted but may not yet be complete.
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
          $ref: '#/components/responses/NotAllowedResponse'
        '409':
          description: The PoE port is already off, or the device cannot accept the request in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
  /v1/devices/{deviceId}/power/poe-events/subscription/{transportId}:
    parameters:
    - $ref: '#/components/parameters/deviceId'
