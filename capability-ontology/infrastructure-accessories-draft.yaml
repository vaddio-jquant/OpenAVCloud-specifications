      operationId: networkInterfaces
      summary: List network interfaces
      description: Returns a page of network interfaces accessible to the caller and the total count across all pages.
      tags:
      - Networking
      responses:
        '200':
          description: Network interfaces were returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInterfacePage'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '405':
